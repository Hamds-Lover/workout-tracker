<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker - Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>🏋️ Workout Tracker</h1>
            
            <!-- Login Form -->
            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <div class="form-group">
                    <input type="text" id="login-username" placeholder="Username" autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
                </div>
                <button id="login-btn" class="auth-btn primary-btn">Login</button>
                <p class="auth-switch">
                    Don't have an account? 
                    <a href="#" id="show-signup-btn">Sign Up</a>
                </p>
                <div id="login-error" class="error-message" style="display:none;"></div>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="auth-form" style="display:none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <input type="text" id="signup-username" placeholder="Choose a username" autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="signup-password" placeholder="Choose a password (min 6 characters)" autocomplete="new-password">
                </div>
                <button id="signup-btn" class="auth-btn primary-btn">Sign Up</button>
                <p class="auth-switch">
                    Already have an account? 
                    <a href="#" id="show-login-btn">Login</a>
                </p>
                <div id="signup-error" class="error-message" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="/auth.js"></script>
</body>
</html>
